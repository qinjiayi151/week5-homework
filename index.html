<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单摆简谐振动模拟</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #1a1a24;
      color: #eef0fa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 40%, rgba(48, 54, 82, 0.22), transparent 58%),
        #1a1a24;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .readout {
      position: fixed;
      top: 24px;
      left: 26px;
      padding: 14px 17px;
      border: 1px solid rgba(172, 185, 230, 0.14);
      border-radius: 12px;
      background: rgba(22, 23, 34, 0.68);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .readout h1 {
      margin: 0 0 10px;
      color: #f4f5fc;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .readout p {
      display: flex;
      justify-content: space-between;
      gap: 26px;
      margin: 5px 0;
      color: #9ca4bd;
      font-size: 12px;
    }

    .readout output {
      color: #dfe5ff;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 22px;
      width: min(680px, calc(100% - 36px));
      padding: 16px 19px;
      transform: translateX(-50%);
      border: 1px solid rgba(172, 185, 230, 0.16);
      border-radius: 14px;
      background: rgba(22, 23, 34, 0.82);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(10px);
    }

    .control {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #aeb6ce;
      font-size: 12px;
    }

    .control output {
      color: #e0e6ff;
      font-variant-numeric: tabular-nums;
    }

    .control input {
      width: 100%;
      margin: 0;
      accent-color: #91aaff;
      cursor: pointer;
    }

    .reset {
      grid-column: 1 / -1;
      justify-self: center;
      padding: 8px 18px;
      border: 1px solid rgba(145, 170, 255, 0.36);
      border-radius: 8px;
      background: rgba(105, 132, 220, 0.16);
      color: #e3e9ff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .reset:hover {
      border-color: rgba(145, 170, 255, 0.7);
      background: rgba(105, 132, 220, 0.28);
    }

    .reset:focus-visible,
    .control input:focus-visible {
      outline: 2px solid #a9bbff;
      outline-offset: 3px;
    }

    .hint {
      position: fixed;
      right: 24px;
      bottom: 25px;
      margin: 0;
      color: rgba(190, 197, 220, 0.55);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 560px) {
      .readout {
        top: 14px;
        left: 14px;
      }

      .controls {
        bottom: 12px;
        gap: 12px;
        padding: 13px;
      }

      .hint {
        display: none;
      }
    }

    @media (max-height: 480px) {
      .readout {
        top: 10px;
        left: 10px;
        padding: 10px 12px;
      }

      .controls {
        bottom: 8px;
        gap: 8px 14px;
        padding: 9px 13px;
      }

      .control {
        gap: 4px;
      }

      .reset {
        padding: 6px 14px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="simulation" aria-label="单摆物理振动模拟画面"></canvas>
  <section class="readout" aria-label="单摆参数">
    <h1>单摆 · 简谐振动</h1>
    <p><span>摆长 L</span><output id="length-readout">200 px</output></p>
    <p><span>重力加速度 g</span><output id="gravity-readout">9.8 m/s²</output></p>
    <p><span>摆角 θ</span><output id="angle">45.0°</output></p>
  </section>
  <section class="controls" aria-label="模拟参数控制">
    <div class="control">
      <label for="length-control">摆长 <output id="length-value">200 px</output></label>
      <input id="length-control" type="range" min="100" max="350" step="1" value="200">
    </div>
    <div class="control">
      <label for="gravity-control">重力 <output id="gravity-value">9.8 m/s²</output></label>
      <input id="gravity-control" type="range" min="1" max="25" step="0.1" value="9.8">
    </div>
    <div class="control">
      <label for="damping-control">阻尼 <output id="damping-value">0.000</output></label>
      <input id="damping-control" type="range" min="0" max="0.01" step="0.001" value="0">
    </div>
    <button class="reset" id="reset" type="button">重置摆动</button>
  </section>
  <p class="hint">理想单摆 · 可调阻尼</p>

  <script>
    "use strict";

    const canvas = document.querySelector("#simulation");
    const context = canvas.getContext("2d");
    const angleOutput = document.querySelector("#angle");
    const lengthControl = document.querySelector("#length-control");
    const gravityControl = document.querySelector("#gravity-control");
    const dampingControl = document.querySelector("#damping-control");
    const resetButton = document.querySelector("#reset");
    const lengthValue = document.querySelector("#length-value");
    const gravityValue = document.querySelector("#gravity-value");
    const dampingValue = document.querySelector("#damping-value");
    const lengthReadout = document.querySelector("#length-readout");
    const gravityReadout = document.querySelector("#gravity-readout");
    const initialAngle = Math.PI / 4;
    const fixedStep = 1 / 240;
    const pixelsPerMeter = 100;
    let length = Number(lengthControl.value);
    let gravity = Number(gravityControl.value);
    let damping = Number(dampingControl.value);
    let angle = initialAngle;
    let angularVelocity = 0;
    let accumulator = 0;
    let previousTime = 0;
    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function acceleration(theta, velocity) {
      const naturalFrequency = Math.sqrt(gravity / (length / pixelsPerMeter));
      return -(naturalFrequency ** 2) * Math.sin(theta)
        - 2 * damping * naturalFrequency * velocity;
    }

    function integrate(step) {
      const a1 = angularVelocity;
      const b1 = acceleration(angle, a1);
      const a2 = angularVelocity + b1 * step / 2;
      const b2 = acceleration(angle + a1 * step / 2, a2);
      const a3 = angularVelocity + b2 * step / 2;
      const b3 = acceleration(angle + a2 * step / 2, a3);
      const a4 = angularVelocity + b3 * step;
      const b4 = acceleration(angle + a3 * step, a4);

      angle += step * (a1 + 2 * a2 + 2 * a3 + a4) / 6;
      angularVelocity += step * (b1 + 2 * b2 + 2 * b3 + b4) / 6;
    }

    function draw() {
      context.clearRect(0, 0, width, height);

      const pivotX = width / 2;
      const pivotY = Math.max(118, height * 0.23);
      const bobX = pivotX + length * Math.sin(angle);
      const bobY = pivotY + length * Math.cos(angle);

      context.beginPath();
      context.arc(pivotX, pivotY, length, Math.PI * 0.08, Math.PI * 0.92);
      context.strokeStyle = "rgba(153, 166, 211, 0.12)";
      context.lineWidth = 1;
      context.setLineDash([3, 7]);
      context.stroke();
      context.setLineDash([]);

      context.beginPath();
      context.moveTo(pivotX, pivotY);
      context.lineTo(bobX, bobY);
      context.strokeStyle = "rgba(196, 205, 235, 0.78)";
      context.lineWidth = 2;
      context.stroke();

      context.beginPath();
      context.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
      context.fillStyle = "#cbd4f5";
      context.fill();
      context.beginPath();
      context.arc(pivotX, pivotY, 2, 0, Math.PI * 2);
      context.fillStyle = "#5e6d9d";
      context.fill();

      const glow = context.createRadialGradient(bobX, bobY, 2, bobX, bobY, 36);
      glow.addColorStop(0, "rgba(113, 153, 255, 0.25)");
      glow.addColorStop(1, "rgba(113, 153, 255, 0)");
      context.beginPath();
      context.arc(bobX, bobY, 36, 0, Math.PI * 2);
      context.fillStyle = glow;
      context.fill();

      const bobGradient = context.createRadialGradient(
        bobX - 7, bobY - 8, 2,
        bobX, bobY, 16
      );
      bobGradient.addColorStop(0, "#e7edff");
      bobGradient.addColorStop(0.28, "#91aaff");
      bobGradient.addColorStop(1, "#5067bb");
      context.beginPath();
      context.arc(bobX, bobY, 13, 0, Math.PI * 2);
      context.fillStyle = bobGradient;
      context.shadowColor = "rgba(105, 139, 255, 0.35)";
      context.shadowBlur = 12;
      context.fill();
      context.shadowBlur = 0;

      angleOutput.value = `${(angle * 180 / Math.PI).toFixed(1)}°`;
    }

    function updateLength() {
      length = Number(lengthControl.value);
      lengthValue.value = `${length} px`;
      lengthReadout.value = `${length} px`;
    }

    function updateGravity() {
      gravity = Number(gravityControl.value);
      gravityValue.value = `${gravity.toFixed(1)} m/s²`;
      gravityReadout.value = `${gravity.toFixed(1)} m/s²`;
    }

    function updateDamping() {
      damping = Number(dampingControl.value);
      dampingValue.value = damping.toFixed(3);
    }

    function animate(timestamp) {
      if (previousTime === 0) previousTime = timestamp;
      const elapsed = Math.min((timestamp - previousTime) / 1000, 0.05);
      previousTime = timestamp;
      accumulator += elapsed;

      while (accumulator >= fixedStep) {
        integrate(fixedStep);
        accumulator -= fixedStep;
      }

      draw();
      requestAnimationFrame(animate);
    }

    lengthControl.addEventListener("input", updateLength);
    gravityControl.addEventListener("input", updateGravity);
    dampingControl.addEventListener("input", updateDamping);
    resetButton.addEventListener("click", () => {
      angle = initialAngle;
      angularVelocity = 0;
      accumulator = 0;
      draw();
    });
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
